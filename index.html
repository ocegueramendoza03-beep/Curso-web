<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi curso en línea</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #243247;
    }

    main {
      max-width: 750px;
      margin: 60px auto;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #174ea6;
    }

    p {
      line-height: 1.6;
    }

    .aviso {
      padding: 16px;
      background: #e8f0fe;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      main {
        margin: 20px 12px;
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bienvenido a mi curso</h1>
    <p>
      Este será el espacio para las lecciones, infografías
      y actividades de evaluación.
    </p>
    <div class="aviso">
      Página de prueba. El contenido del curso se agregará después.
    </div>
  </main>
</body>
</html>
